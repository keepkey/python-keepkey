version: 2          # keep 2.0 syntax; CircleCI 2.1 also works

jobs:
  emulator-build-test:
    docker:
      - image: circleci/python:3.7      # upgrade to cimg/python:3.12 if you like
    steps:
      # ────────────────────────────────────────────────────────────────
      # 1) Clone the current branch of python-keepkey via HTTPS
      # ────────────────────────────────────────────────────────────────
      - run:
          name: Clone python-keepkey (current branch)
          command: |
            git clone --depth 1 -b "$CIRCLE_BRANCH" https://github.com/keepkey/python-keepkey.git .pykk
            cd .pykk && git submodule update --init --recursive

      # ────────────────────────────────────────────────────────────────
      # 2) Grab firmware repo and inject our fresh python-keepkey copy
      # ────────────────────────────────────────────────────────────────
      - run:
          name: Checkout firmware & inject python-keepkey
          command: |
            # Ensure all submodule URLs fall back to HTTPS
            git config --global url."https://github.com/".insteadOf git@github.com:
            git config --global url."https://".insteadOf git://

            # Move python-keepkey out of the way
            mv .pykk ../

            # Clone firmware repository (expects $FIRMWARE_REPO env var)
            git clone --depth 1 -b master "$FIRMWARE_REPO" .

            # Initialise firmware submodules
            git submodule update --init --recursive

            # Replace the vendor copy with our PR branch python-keepkey
            rm -rf deps/python-keepkey
            mv ../.pykk deps/python-keepkey

      # ────────────────────────────────────────────────────────────────
      # 3) Build the Docker-based emulator tests
      # ────────────────────────────────────────────────────────────────
      - setup_remote_docker

      - run:
          name: Emulator tests
          command: |
            pushd ./scripts/emulator
            set +e                                   # don’t exit on first failure
            docker-compose up --build python-keepkey
            set -e

            # Collect JUnit / pytest XML results
            mkdir -p ../../test-reports
            docker cp "$(docker-compose ps -q python-keepkey)":/kkemu/test-reports/. ../../test-reports/
            popd

            # Fail the job on this repo's OWN result.
            #
            # The firmware's C++ firmware-unit suite used to run here and gated
            # this job. It was dropped because it failed python-keepkey for
            # reasons no python change caused: a token-table change cannot go
            # green here until the matching firmware change reaches the branch
            # this clones, which is a release away. The firmware repo runs that
            # suite in its own CI.
            #
            # This repo IS in the firmware's build graph, though, so dropping
            # the suite is not free. keepkey-firmware's lib/firmware/CMakeLists.txt
            # generates ethereum_tokens.def and uniswap_tokens.def by running
            # deps/python-keepkey/keepkeylib/eth/{ethereum,uniswap}_tokens.py,
            # and kkfirmware depends on that target -- so a change here can
            # break the firmware C++ BUILD, and tokens[] is what
            # unittests/firmware/coins.cpp reads.
            #
            # tests/test_token_table_generators.py is the replacement gate for
            # exactly that coupling: it runs both generators and asserts the
            # emitted table is well-formed, budget-conforming and
            # deterministic. Do not remove it without restoring firmware-unit.
            #
            # Read the status file defensively -- it is written by the container,
            # and a crash before it exists must FAIL rather than silently pass an
            # empty-string comparison.
            STATUS_FILE=test-reports/python-keepkey/status
            if [ ! -f "$STATUS_FILE" ]; then
              echo "no status file at $STATUS_FILE -- the suite did not finish"
              exit 1
            fi
            [ "$(cat "$STATUS_FILE")" = "0" ] || exit 1

      - store_test_results:
          path: test-reports

# ──────────────────────────────────────────────────────────────────────
workflows:
  version: 2
  emulator:
    jobs:
      - emulator-build-test
