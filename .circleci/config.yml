version: 2          # keep 2.0 syntax; CircleCI 2.1 also works

jobs:
  emulator-build-test:
    docker:
      - image: circleci/python:3.7      # upgrade to cimg/python:3.12 if you like
    steps:
      # ────────────────────────────────────────────────────────────────
      # 1) Clone the current branch of python-keepkey via HTTPS
      # ────────────────────────────────────────────────────────────────
      - run:
          name: Clone python-keepkey (current branch)
          command: |
            # Fork-only PR branches do not exist in keepkey/python-keepkey.
            # Clone the repository that triggered this CircleCI project so the
            # exact CIRCLE_SHA1 under review is available and verifiable.
            git clone --depth 1 -b "$CIRCLE_BRANCH" \
              "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" .pykk
            test "$(git -C .pykk rev-parse HEAD)" = "$CIRCLE_SHA1"
            cd .pykk && git submodule update --init --recursive

      # ────────────────────────────────────────────────────────────────
      # 2) Grab firmware repo and inject our fresh python-keepkey copy
      # ────────────────────────────────────────────────────────────────
      - run:
          name: Checkout firmware & inject python-keepkey
          command: |
            # Ensure all submodule URLs fall back to HTTPS
            git config --global url."https://github.com/".insteadOf git@github.com:
            git config --global url."https://".insteadOf git://

            # Move python-keepkey out of the way
            mv .pykk ../

            # This companion branch gates the fork's 7.15 firmware PR, not the
            # default firmware branch. Keep the target explicit; the checkout
            # then replaces its python-keepkey submodule with CIRCLE_SHA1 below.
            git clone --depth 1 -b release/7.15 \
              https://github.com/BitHighlander/keepkey-firmware.git .

            # Match firmware CI's build set. A recursive init reaches optional
            # trezor-firmware vendors that do not support shallow HTTPS clones.
            git submodule update --init --depth 1 deps/crypto/trezor-firmware
            git submodule update --init --depth 1 deps/device-protocol
            git submodule update --init --depth 1 deps/googletest
            git submodule update --init --depth 1 deps/qrenc/QR-Code-generator
            git submodule update --init --depth 1 deps/sca-hardening/SecAESSTM32

            # Replace the vendor copy with our PR branch python-keepkey
            rm -rf deps/python-keepkey
            mv ../.pykk deps/python-keepkey

            # This is python-keepkey's standalone compatibility lane. Release
            # OLED/PDF evidence is generated only by the exact-head firmware
            # workflow, where the firmware and Python SHAs are pinned together.
            # Do not inherit the firmware checkout's report/screenshot phase:
            # it can describe a different (published/master) emulator and is
            # therefore not release evidence for this Python PR.
            cp deps/python-keepkey/.circleci/standalone-emulator-tests.sh \
              scripts/emulator/python-keepkey-tests.sh

      # ────────────────────────────────────────────────────────────────
      # 3) Build the Docker-based emulator tests
      # ────────────────────────────────────────────────────────────────
      - setup_remote_docker

      - run:
          name: Emulator tests
          command: |
            pushd ./scripts/emulator
            set +e                                   # don’t exit on first failure
            docker-compose up --build python-keepkey
            set -e

            # Collect JUnit / pytest XML results
            mkdir -p ../../test-reports
            docker cp "$(docker-compose ps -q python-keepkey)":/kkemu/test-reports/. ../../test-reports/
            popd

            # Fail the job on this repo's OWN result.
            #
            # The firmware's C++ firmware-unit suite used to run here and gated
            # this job. No change in THIS repository can affect firmware C++, and
            # the firmware repo already runs that suite in its own CI, so all it
            # did was fail python-keepkey for reasons no python change caused: a
            # token-table change cannot go green here until the matching firmware
            # change reaches the branch this clones, which is a release away.
            #
            # Read the status file defensively -- it is written by the container,
            # and a crash before it exists must FAIL rather than silently pass an
            # empty-string comparison.
            STATUS_FILE=test-reports/python-keepkey/status
            if [ ! -f "$STATUS_FILE" ]; then
              echo "no status file at $STATUS_FILE -- the suite did not finish"
              exit 1
            fi
            [ "$(cat "$STATUS_FILE")" = "0" ] || exit 1

      - store_test_results:
          path: test-reports

# ──────────────────────────────────────────────────────────────────────
workflows:
  version: 2
  emulator:
    jobs:
      - emulator-build-test
