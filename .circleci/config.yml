version: 2          # keep 2.0 syntax; CircleCI 2.1 also works

jobs:
  emulator-build-test:
    docker:
      - image: circleci/python:3.7      # upgrade to cimg/python:3.12 if you like
    steps:
      # ────────────────────────────────────────────────────────────────
      # 1) Clone the current branch of python-keepkey via HTTPS
      # ────────────────────────────────────────────────────────────────
      - run:
          name: Clone python-keepkey (current branch)
          command: |
            git clone --depth 1 -b "$CIRCLE_BRANCH" \
              "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" .pykk
            cd .pykk && git submodule update --init --recursive

      # ────────────────────────────────────────────────────────────────
      # 2) Grab firmware repo and inject our fresh python-keepkey copy
      # ────────────────────────────────────────────────────────────────
      - run:
          name: Checkout firmware & inject python-keepkey
          command: |
            # Ensure all submodule URLs fall back to HTTPS
            git config --global url."https://github.com/".insteadOf git@github.com:
            git config --global url."https://".insteadOf git://

            # Move python-keepkey out of the way
            mv .pykk ../

            # Test the same exact companion implementation as the GitHub
            # Actions integration lane. Bump deliberately with that workflow.
            git init .
            git remote add origin https://github.com/BitHighlander/keepkey-firmware.git
            git fetch --depth 1 origin e07a95e7d069553c273b24552c9bc436f60f5d91
            git checkout --detach FETCH_HEAD

            # Initialise firmware submodules
            git submodule update --init --recursive

            # Replace the vendor copy with our PR branch python-keepkey
            rm -rf deps/python-keepkey
            mv ../.pykk deps/python-keepkey

      # ────────────────────────────────────────────────────────────────
      # 3) Build the Docker-based emulator tests
      # ────────────────────────────────────────────────────────────────
      - setup_remote_docker

      - run:
          name: Emulator tests
          command: |
            pushd ./scripts/emulator
            set +e                                   # don’t exit on first failure
            docker-compose up --build python-keepkey
            set -e

            # Collect JUnit / pytest XML results
            mkdir -p ../../test-reports
            docker cp "$(docker-compose ps -q firmware-unit)":/kkemu/test-reports/. ../../test-reports/
            docker cp "$(docker-compose ps -q python-keepkey)":/kkemu/test-reports/. ../../test-reports/
            popd

            # python-keepkey depends on firmware-unit in the pinned firmware's
            # compose graph, so both suites run and both results gate this job.
            # Read each status file defensively: a container crash before the
            # file exists must fail rather than silently pass an empty value.
            for SUITE in python-keepkey firmware-unit; do
              STATUS_FILE="test-reports/$SUITE/status"
              if [ ! -f "$STATUS_FILE" ]; then
                echo "no status file at $STATUS_FILE -- the suite did not finish"
                exit 1
              fi
              [ "$(cat "$STATUS_FILE")" = "0" ] || exit 1
            done

      - store_test_results:
          path: test-reports

# ──────────────────────────────────────────────────────────────────────
workflows:
  version: 2
  emulator:
    jobs:
      - emulator-build-test
